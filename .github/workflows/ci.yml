name: Platform verification
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    name: Platform Verification & Clinical Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci --prefix frontend/website --ignore-scripts
      - name: Verify TypeScript Compilation (Strict Mode)
        run: npm run typecheck
      - name: Run 172 Clinical Vitest Test Suite
        run: npm test

  mobile-typecheck:
    name: Mobile Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cd apps/mobile && npm ci && npm run typecheck
